# Render Blueprint — New + > Blueprint, then pick this repository.
services:
  - type: web
    name: ts-case-study-builder
    runtime: node
    plan: starter            # persistent disks need a paid instance
    buildCommand: "echo no build step"
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false          # Render asks for a value when you create the Blueprint
    disk:
      name: case-study-data
      mountPath: /var/data
      sizeGB: 1
